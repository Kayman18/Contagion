name: Publish Contagion 1.1

on:
  push:
    branches: [main]
    paths: ['firmware/SHA256SUMS']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contagion-v1-1-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and publish 1.1
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd firmware && sha256sum -c SHA256SUMS)
          if gh release view v1.1.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.1.0 \
            firmware/Contagion-1.1-All-Banks-8V.fwsc \
            firmware/Contagion-USB-Editor-1.1.zip \
            firmware/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Contagion 1.1" \
            --notes-file docs/release-1.1.md
