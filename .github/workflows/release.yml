name: Publish Contagion 1.0.0

on:
  push:
    branches: [main]
    paths: ['firmware/SHA256SUMS']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contagion-v1-release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify and publish the three 8-voice images
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          (cd firmware && sha256sum -c SHA256SUMS)
          if gh release view v1.0.0 >/dev/null 2>&1; then
            exit 0
          fi
          gh release create v1.0.0 \
            firmware/Contagion-Virus-A-8V.fwsc \
            firmware/Contagion-Virus-B-8V.fwsc \
            firmware/Contagion-Virus-C-8V.fwsc \
            firmware/SHA256SUMS \
            --target "$GITHUB_SHA" \
            --title "Contagion 1.0.0 (8 voices)" \
            --notes "Three 8-voice FM-1 firmware images, one per Virus A, B and C preset collection. Includes the blueprint splash, dual-core BAND20 engine and native USER patch storage. Package checks and simulator UI tests passed. Hardware testing of these release binaries is pending."
